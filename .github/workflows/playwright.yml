name: E2E (Playwright)

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Persist Playwright browsers in a cacheable location
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.57.0-v3-${{ hashFiles('package-lock.json') }}

      - name: Tune npm network retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: |
          npx playwright install-deps chromium
          for i in 1 2; do
            if ls /home/runner/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell >/dev/null 2>&1 && ls /home/runner/.cache/ms-playwright/ffmpeg-*/ffmpeg-linux >/dev/null 2>&1; then
              echo "Playwright binaries verified."
              break
            fi
            echo "Installing Playwright chromium, headless-shell, and ffmpeg (attempt $i)..."
            PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=30000 npx playwright install chromium chromium-headless-shell ffmpeg || true
            if ls /home/runner/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell >/dev/null 2>&1 && ls /home/runner/.cache/ms-playwright/ffmpeg-*/ffmpeg-linux >/dev/null 2>&1; then
              echo "Playwright binaries verified."
              break
            fi
            sleep 5
          done
          if ! ls /home/runner/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell >/dev/null 2>&1; then
            if command -v google-chrome >/dev/null 2>&1; then
              echo "Falling back to system google-chrome binary."
              echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            fi
          fi
          if ! ls /home/runner/.cache/ms-playwright/ffmpeg-*/ffmpeg-linux >/dev/null 2>&1; then
            echo "PLAYWRIGHT_DISABLE_VIDEO=1" >> "$GITHUB_ENV"
            if command -v ffmpeg >/dev/null 2>&1; then
              mkdir -p /home/runner/.cache/ms-playwright/ffmpeg-1011
              ln -sf "$(command -v ffmpeg)" /home/runner/.cache/ms-playwright/ffmpeg-1011/ffmpeg-linux
            fi
          fi

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Test confirmed-lead tracking
        run: node --test tests/conversion-funnel.test.cjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
