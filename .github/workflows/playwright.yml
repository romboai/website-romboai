name: E2E (Playwright)

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Persist Playwright browsers in a cacheable location
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.57.0-v2-${{ hashFiles('package-lock.json') }}

      - name: Tune npm network retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: |
          npx playwright install-deps chromium
          for i in 1 2 3 4 5; do
            if ls /home/runner/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell >/dev/null 2>&1; then
              echo "Playwright chromium-headless-shell binary verified."
              break
            fi
            echo "Installing Playwright chromium + headless shell (attempt $i)..."
            rm -rf /home/runner/.cache/ms-playwright/chromium*
            PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000 npx playwright install --force chromium chromium-headless-shell || true
            if ls /home/runner/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell >/dev/null 2>&1; then
              echo "Playwright chromium-headless-shell binary verified."
              break
            fi
            echo "Playwright browser download incomplete (attempt $i). Retrying in 10s..."
            sleep 10
          done
          if ! ls /home/runner/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell >/dev/null 2>&1; then
            if command -v google-chrome >/dev/null 2>&1; then
              echo "Falling back to system google-chrome binary."
              echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
            else
              echo "Chromium headless shell binary missing after retries." >&2
              exit 1
            fi
          fi

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Test confirmed-lead tracking
        run: node --test tests/conversion-funnel.test.cjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
